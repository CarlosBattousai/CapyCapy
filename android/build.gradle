plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'com.capycapy.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.capycapy.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2-test'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
            assets.srcDirs = ['build/assets']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        test {
            storeFile file(System.getenv('CAPY_SIGNING_KEY') ?: '/workspace/android-tools/capy-test.keystore')
            storePassword 'android'
            keyAlias 'capytest'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.test; minifyEnabled false }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
